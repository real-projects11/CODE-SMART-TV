<!DOCTYPE html>

<title>Generador de Código de Acceso</title>

<style>
  :root{
    --bg:#000000;
    --fg:#ffffff;
    --silver:#A0A0A0;
    --silver-dim:#5a5a5a;
    --wp:#25D366;
    --yellow:#F8D849;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background:var(--bg);
    color:var(--fg);
    font-family:'Courier New', 'Segoe UI', monospace, sans-serif;
  }
  body{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    width:100vw;
    align-items:center;
    justify-content:center;
    padding:5vh 5vw;
    gap:24px;
  }

  .panel{
    width:100%;
    max-width:900px;
    background:#080808;
    border:2px solid #222;
    border-radius:18px;
    padding:3.4vw 3vw;
  }

  @keyframes fadeIn{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }

  #resultState{ display:flex; flex-direction:column; gap:26px; animation:fadeIn .4s ease; }
  .result-title{ font-size:clamp(18px, 1.8vw, 26px); color:var(--silver); letter-spacing:1.5px; text-transform:uppercase; text-align:center; }

  .code-card{
    border:2px solid var(--silver-dim); border-radius:14px; padding:24px 28px; display:flex;
    align-items:center; justify-content:space-between; gap:20px; background:#0a0a0a; animation:fadeIn .5s ease;
  }
  .code-card .label{ font-size:clamp(13px, 1.2vw, 17px); color:var(--silver); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
  .code-card .code{ font-size:clamp(36px, 4.2vw, 58px); font-weight:800; letter-spacing:6px; color:var(--fg); }

  .copy-btn{
    background:transparent; border:3px solid var(--silver); color:var(--fg); padding:16px 28px;
    border-radius:12px; font-size:clamp(15px, 1.3vw, 19px); cursor:pointer; transition:all .2s ease;
    flex-shrink:0; white-space:nowrap;
  }
  .copy-btn:hover{ background:var(--fg); color:#000; }
  .copy-btn.copied{ background:#3ddc6a; border-color:#3ddc6a; color:#000; font-weight: bold; }

  /* ===== FOCO PARA CONTROL REMOTO ===== */
  .copy-btn:focus, .copy-btn:focus-visible,
  .wa-btn:focus, .wa-btn:focus-visible{
    outline:none;
    border-color:var(--yellow);
    box-shadow:0 0 0 5px rgba(248,216,73,0.35);
    transform:scale(1.05);
  }

  .wa-btn{
    display:flex; align-items:center; justify-content:center; gap:14px; background:var(--wp);
    color:#ffffff; border:3px solid var(--wp); padding:20px; border-radius:12px; font-weight:700;
    font-size:clamp(16px, 1.4vw, 20px); letter-spacing:.5px; cursor:pointer; text-decoration:none;
    transition:transform .15s ease, filter .2s ease;
  }
  .wa-btn:hover{ filter:brightness(1.08); transform:translateY(-1px); }
  .wa-btn svg{ width:28px; height:28px; flex-shrink:0; }

  /* Adsterra: mismo banner, un poco más de aire para pantalla grande */
  .ad-slot-small{
    margin-top:10px;
    margin-bottom:6px;
    width:320px;
    min-height:50px;
    height:auto;
    max-width:100%;
    background:#0a0a0a;
    border:1px dashed var(--silver-dim);
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-left:auto;
    margin-right:auto;
    position:relative;
  }

  .ad-slot-small iframe,
  .ad-slot-big iframe {
    max-width: 100% !important;
    display: block !important;
  }

  .ad-slot-big {
    margin-top:16px; width:300px; height:250px; background:#0a0a0a;
    border:1px solid #1f1f1f; border-radius:12px; margin-left:auto; margin-right:auto;
    position: relative; overflow:hidden;
  }
</style>
</head>

<script>
  // ===== CONFIG =====
  const CODE_LINK = "https://code-5wr4.vercel.app/";

  // Foco automático al primer botón de copiar, para navegación con control remoto
  window.addEventListener('load', () => {
    const first = document.querySelector('.copy-btn');
    if (first) first.focus();
  });

  // ===== LÓGICA DE COPIADO REAL =====
  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const code = btn.getAttribute('data-code');

      // Copiar al portapapeles
      navigator.clipboard.writeText(code).then(() => {
        // Feedback visual
        btn.textContent = '¡Copiado!';
        btn.classList.add('copied');

        setTimeout(() => {
          btn.textContent = 'Copiar';
          btn.classList.remove('copied');
        }, 2000);
      }).catch(err => {
        // Fallback para navegadores de TV antiguos
        const tempInput = document.createElement('input');
        tempInput.value = code;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);

        btn.textContent = '¡Copiado!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copiar';
          btn.classList.remove('copied');
        }, 2000);
      });
    });
  });

  // ===== BOTÓN WHATSAPP =====
  const waBtn = document.getElementById('shareWaBtn');
  const waMessage = `Generá los códigos para descargar la aplicación acá: ${CODE_LINK}`;
  waBtn.href = `https://wa.me/?text=${encodeURIComponent(waMessage)}`;
</script>
