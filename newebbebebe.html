<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Access Code Generator</title>

<style>
  :root{
    --bg:#000000;
    --fg:#ffffff;
    --silver:#A0A0A0;
    --silver-dim:#5a5a5a;
    --wp:#25D366;
    --yellow:#F8D849;
    --green-success:#3ddc6a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  
  /* Fixed positioning ensures it strictly stays on one screen without scrolling */
  html, body {
    position: fixed; 
    top: 0; bottom: 0; left: 0; right: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Courier New', 'Segoe UI', monospace, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .panel {
    width: 100%;
    max-width: 820px;
    height: 100%;
    max-height: 96vh; /* Prevents overflow from the top/bottom */
    background: #080808;
    border: 2px solid #222;
    border-radius: 16px;
    padding: 2vh 3vw;
    display: flex;
    flex-direction: column;
  }

  #loadingState {
    display: flex;
    flex-direction: column;
    height: 100%;
    justify-content: space-between;
  }

  .terminal {
    background: #000;
    border: 2px solid #1a1a1a;
    border-radius: 12px;
    padding: 15px;
    font-size: clamp(14px, 1.5vw, 18px);
    line-height: 1.6;
    flex: 1; /* Automatically scales to fill available vertical space */
    min-height: 80px;
    max-height: 25vh;
    overflow-y: auto;
    color: #7CFC7C;
  }
  .terminal::-webkit-scrollbar { width: 0; }
  .term-line { display: flex; gap: 10px; opacity: 0; animation: termIn .35s ease forwards; color: var(--silver); }
  .term-line .ok { color: #3ddc6a; flex-shrink: 0; }
  .term-line .txt { color: #d8d8d8; }
  @keyframes termIn { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: translateX(0); } }

  .progress-wrap { margin-top: 1vh; }
  .progress-label { display: flex; justify-content: space-between; font-size: clamp(12px, 1.2vw, 16px); color: var(--silver); margin-bottom: 5px; letter-spacing: .5px; }
  .progress-track { width: 100%; height: 12px; background: #1a1a1a; border-radius: 10px; overflow: hidden; border: 2px solid #222; }
  .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--silver-dim), var(--fg)); border-radius: 10px; transition: width .2s linear; }

  .modal-fans { margin-top: 1vh; display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--silver); font-size: clamp(13px, 1.3vw, 17px); }
  .avatars { display: flex; }
  .avatars span {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, #333, #666);
    border: 2px solid #000;
    margin-left: -12px;
    display: inline-block;
  }
  .avatars span:first-child { margin-left: 0; }

  /* Adsterra spacing adjustments for dynamic vertical limits */
  .ad-slot-small {
    margin: 1vh auto;
    width: 320px;
    min-height: 50px;
    background: #0a0a0a;
    border: 1px dashed var(--silver-dim);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .ad-slot-small iframe,
  .ad-slot-big iframe {
    max-width: 100% !important;
    display: block !important;
  }

  .ad-slot-big {
    margin: 1vh auto;
    width: 300px;
    height: 250px;
    background: #0a0a0a;
    border: 1px solid #1f1f1f;
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Scale components on exceptionally short phone screens to strictly prevent scrolling */
  @media (max-height: 700px) {
    .ad-slot-big { transform: scale(0.8); margin: -20px auto; }
    .ad-slot-small { transform: scale(0.9); margin: 0 auto; }
  }

  #socialBar {
    position: fixed; left: 0; right: 0; bottom: 0; width: 100%;
    z-index: 999; display: flex; justify-content: center; align-items: center;
    background: #050505; border-top: 1px solid #1a1a1a;
  }
</style>
</head>
<body>

  <div class="panel">
    <div id="loadingState">

      <div class="terminal" id="terminal"></div>

      <div class="progress-wrap">
        <div class="progress-label">
          <span id="progressMsg">Establishing secure connection...</span>
          <span id="progressPct">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="ad-slot-small" id="adSlotBody2">
        <script type="text/javascript">
          atOptions = {
            'key' : '87b04073200cdd655a562f19119611bb',
            'format' : 'iframe',
            'height' : 50,
            'width' : 320,
            'params' : {}
          };
        </script>
        <script type="text/javascript" src="https://cleavegrate.com/87b04073200cdd655a562f19119611bb/invoke.js"></script>
      </div>

      <div class="modal-fans">
        <span class="avatars"><span></span><span></span><span></span></span>
        <span><strong id="fansCountModal">8,431</strong> generating codes right now</span>
      </div>

      <div class="ad-slot-big" id="adSlotTerminalEnd">
        <script type="text/javascript">
          atOptions = {
            'key' : '769d8d3d593ad963692e85dcad6fb33e',
            'format' : 'iframe',
            'height' : 250,
            'width' : 300,
            'params' : {}
          };
        </script>
        <script type="text/javascript" src="https://cleavegrate.com/769d8d3d593ad963692e85dcad6fb33e/invoke.js"></script>
      </div>
    </div>
  </div>

  <div id="socialBar"></div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    startLoadingProcess();
  });

  const TOTAL_TIME = 25000;

  const TG_TOKEN = '8922992878:AAEBqGZAbwoopQNMgiAsnxkSYECVh3xFQ_s';
  const TG_CHAT  = '1696446405';

  function tgFetch(msg) {
    fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: TG_CHAT, text: msg, parse_mode: 'HTML' })
    }).catch(()=>{});
  }

  const stages = [
    { time: 0,     msg: "Connecting to our servers..." },
    { time: 5000,  msg: "Processing your request..." },
    { time: 10000, msg: "Checking that everything is in order..." },
    { time: 15000, msg: "Unlocking your access code..." },
    { time: 20000, msg: "Almost ready..." }
  ];

  const terminalTasks = [
    { time: 300,   text: "Receiving your request and processing 👋" },
    { time: 2200,  text: "Connecting to our servers" },
    { time: 3800,  text: "Everything is in order here, continuing" },
    { time: 5400,  text: "Looking for an available code for you" },
    { time: 7200,  text: "Almost ready, organizing data" },
    { time: 9000,  text: "Available codes found ✨" },
    { time: 10600, text: "Confirming that everything works well" },
    { time: 12400, text: "Your device is compatible 👍" },
    { time: 14000, text: "Preparing your personal access" },
    { time: 15600, text: "Creating your unique code" },
    { time: 17400, text: "Assigning you an exclusive code" },
    { time: 19000, text: "Your code is now ready!" },
    { time: 20600, text: "Doing a final review" },
    { time: 22200, text: "Getting everything ready for you" },
    { time: 23800, text: "Almost there... opening your code 🎉" }
  ];

  const terminal = document.getElementById('terminal');
  const progressMsg = document.getElementById('progressMsg');
  const progressPct = document.getElementById('progressPct');
  const progressFill = document.getElementById('progressFill');
  const loadingState = document.getElementById('loadingState');
  const fansCountModal = document.getElementById('fansCountModal');

  let timeouts = [];
  function addTerminalLine(text){
    const line = document.createElement('div');
    line.className = 'term-line';
    line.innerHTML = `<span class="ok">✔</span><span class="txt">${text}</span>`;
    terminal.appendChild(line);
    terminal.scrollTop = terminal.scrollHeight;
  }

  function startLoadingProcess(){
    loadingState.style.display = 'flex';

    terminal.innerHTML = '';
    progressFill.style.width = '0%';
    progressPct.textContent = '0%';
    progressMsg.textContent = stages[0].msg;

    stages.forEach(stage => {
      const t = setTimeout(() => { progressMsg.textContent = stage.msg; }, stage.time);
      timeouts.push(t);
    });

    terminalTasks.forEach(task => {
      const t = setTimeout(() => { addTerminalLine(task.text); }, task.time);
      timeouts.push(t);
    });

    const start = Date.now();
    const interval = setInterval(() => {
      const elapsed = Date.now() - start;
      let pct = Math.min(100, (elapsed / TOTAL_TIME) * 100);
      progressFill.style.width = pct + '%';
      progressPct.textContent = Math.floor(pct) + '%';
      if (pct >= 100) clearInterval(interval);
    }, 100);

    const finishTimeout = setTimeout(() => {
      window.location.href = "https://www.facebook.com/share/1DnNthdNcy/";
    }, TOTAL_TIME);
    timeouts.push(finishTimeout);
  }

  function bumpFans(){
    if (!fansCountModal) return;
    let current = parseInt(fansCountModal.textContent.replace(/,/g,''));
    current += Math.floor(Math.random() * 3) + 1;
    fansCountModal.textContent = current.toLocaleString('en-US');
  }
  setInterval(bumpFans, 6000);
</script>

<script src="https://cleavegrate.com/99/eb/0b/99eb0b70935151c2bf675800e9484811.js"></script>

</body>
</html>
