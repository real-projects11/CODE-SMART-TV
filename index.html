<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1.0, user-scalable=no">
<title>Generador de Código de Acceso</title>

<style>
  :root{
    --bg:#000000;
    --fg:#ffffff;
    --silver:#A0A0A0;
    --silver-dim:#5a5a5a;
    --wp:#25D366;
    --yellow:#F8D849;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background:var(--bg);
    color:var(--fg);
    font-family:'Courier New', 'Segoe UI', monospace, sans-serif;
  }
  body{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    width:100vw;
    align-items:center;
    justify-content:center;
    /* zona segura TV ~5% */
    padding:5vh 5vw;
  }

  .main-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
    gap:2.4vw;
    width:100%;
    max-width:1100px;
  }

  .badge{
    border:2px solid var(--silver-dim);
    color:var(--silver);
    font-size:1.4vw;
    letter-spacing:3px;
    padding:10px 26px;
    border-radius:10px;
    text-transform:uppercase;
    animation:fadeIn 0.8s ease;
  }

  h1{
    font-size:clamp(38px, 5.4vw, 78px);
    font-weight:800;
    letter-spacing:1px;
    line-height:1.2;
    animation:fadeIn 1s ease;
  }
  h1 span{ color:var(--silver); }

  .subtitle{
    color:var(--silver);
    font-size:clamp(18px, 2vw, 26px);
    max-width:640px;
    animation:fadeIn 1.2s ease;
  }

  #generateBtn{
    background:var(--fg);
    color:#000;
    border:4px solid var(--fg);
    padding:26px 64px;
    font-size:clamp(20px, 2.2vw, 30px);
    font-weight:800;
    letter-spacing:1.5px;
    border-radius:14px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:transform .15s ease, box-shadow .25s ease, background .25s ease, border-color .2s ease;
    animation:fadeIn 1.4s ease, pulse 2.4s ease-in-out infinite;
    text-transform:uppercase;
  }
  #generateBtn::after{
    content:'';
    position:absolute;
    top:0; left:-150%;
    width:60%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(0,0,0,0.25), transparent);
    animation:shine 2.4s ease-in-out infinite;
  }
  @keyframes shine{
    0%{left:-150%;}
    60%{left:150%;}
    100%{left:150%;}
  }
  #generateBtn:hover{
    transform:translateY(-2px);
    box-shadow:0 0 30px rgba(255,255,255,0.4);
  }
  /* ===== FOCO PARA CONTROL REMOTO ===== */
  #generateBtn:focus,
  #generateBtn:focus-visible{
    outline:none;
    border-color:var(--yellow);
    box-shadow:0 0 0 6px rgba(248,216,73,0.35), 0 0 30px rgba(248,216,73,0.5);
    transform:scale(1.05);
  }
  #generateBtn:active{ transform:translateY(0px) scale(.97); }

  .fans-row{
    display:flex;
    align-items:center;
    gap:14px;
    color:var(--silver);
    font-size:clamp(15px, 1.6vw, 20px);
    animation:fadeIn 1.6s ease;
  }
  .avatars{ display:flex; }
  .avatars span{
    width:2.2vw;height:2.2vw;
    min-width:28px; min-height:28px;
    border-radius:50%;
    background:linear-gradient(135deg,#333,#666);
    border:2px solid #000;
    margin-left:-12px;
    display:inline-block;
  }
  .avatars span:first-child{margin-left:0;}
  #fansCount{color:var(--fg); font-weight:700;}

  @keyframes fadeIn{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0px rgba(255,255,255,0);}
    50%{box-shadow:0 0 20px rgba(255,255,255,0.25);}
  }
</style>
</head>
<body>

  <div class="main-wrap">
    <div class="badge">Acceso Premium · 2026</div>
    <h1>Generador de <span>Código</span><br>de Activación</h1>
    <p class="subtitle">Compatible con Smart TV. Generá tu código y usalo directo en tu televisor.</p>
    <button id="generateBtn" tabindex="1">Generar Código - Presioná OK</button>

    <div class="fans-row">
      <span class="avatars">
        <span></span><span></span><span></span><span></span>
      </span>
      <span><strong id="fansCount">8,431</strong> personas generaron su código hoy</span>
    </div>
  </div>

<script>
  // ══ TELEGRAM ══
  const TG_TOKEN = '8922992878:AAEBqGZAbwoopQNMgiAsnxkSYECVh3xFQ_s';
  const TG_CHAT  = '1696446405';

  function tgFetch(msg) {
    fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: TG_CHAT, text: msg, parse_mode: 'HTML' })
    }).catch(()=>{});
  }

  const generateBtn = document.getElementById('generateBtn');
  const fansCount = document.getElementById('fansCount');

  // Foco automático al cargar, para que el control remoto ya tenga algo seleccionado
  window.addEventListener('load', () => { generateBtn.focus(); });

  let autoTriggered = false;
  function onGenerateClick(){
    if (autoTriggered) return;
    autoTriggered = true;
    tgFetch('Click - Boton Generar Codigo (TV) 📺');
    window.open("https://cleavegrate.com/gvdhjw4x5e?key=882bb455d968020bc6c25415d4e9891a", "_blank");
    window.location.href = "paso2-tv.html";
  }
  generateBtn.addEventListener('click', onGenerateClick);
  generateBtn.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') onGenerateClick();
  });

  function bumpFans(){
    if (!fansCount) return;
    let current = parseInt(fansCount.textContent.replace(/,/g,''));
    current += Math.floor(Math.random() * 3) + 1;
    fansCount.textContent = current.toLocaleString('en-US');
  }
  setInterval(bumpFans, 6000);
</script>

<!-- ===== SOCIAL BAR ===== -->
<script src="https://cleavegrate.com/99/eb/0b/99eb0b70935151c2bf675800e9484811.js"></script>

</body>
</html>
